  discovery-browser:
    name: Discovery browser smoke
    needs: changes
    if: needs.changes.outputs.discovery_browser == 'true' || needs.changes.outputs.media_browser == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: one-world-route-public-mvp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: one-world-route-public-mvp/qa/package-lock.json
      - name: Install browser QA dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix qa
      - name: Run bounded discovery PR fast smoke
        if: github.event_name == 'pull_request'
        env:
          OWR_QA_NO_VIDEO: '1'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          START_SECONDS=$(date +%s)
          STATUS=0
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/discovery-fast.spec.mjs --project=desktop-1440 --project=mobile-390 --workers=2 || STATUS=$?
          DURATION=$(( $(date +%s) - START_SECONDS ))
          {
            echo "### Discovery PR fast smoke"
            echo "- Duration: ${DURATION}s"
            echo "- Budget: <= 60s"
            echo "- Strategy: all catalog card IDs asserted in DOM; one shared renderer journey opened per viewport"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( DURATION > 60 )); then echo "::warning::Discovery PR fast smoke exceeded 60s budget (${DURATION}s)"; fi
          exit "$STATUS"
      - name: Run media slot PR smoke
        if: github.event_name == 'pull_request' && needs.changes.outputs.media_browser == 'true'
        env:
          OWR_QA_NO_VIDEO: '1'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          START_SECONDS=$(date +%s)
          STATUS=0
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/visual-cover-slot.spec.mjs --project=desktop-1440 --project=mobile-390 --workers=2 || STATUS=$?
          DURATION=$(( $(date +%s) - START_SECONDS ))
          {
            echo "### Media slot PR smoke"
            echo "- Duration: ${DURATION}s"
            echo "- Budget: <= 60s"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( DURATION > 60 )); then echo "::warning::Media slot smoke exceeded 60s budget (${DURATION}s)"; fi
          exit "$STATUS"
      - name: Run scheduled/manual discovery confidence suite
        if: github.event_name != 'pull_request'
        env:
          OWR_QA_NO_VIDEO: '1'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/platform-smoke.spec.mjs tests/visual-cover-slot.spec.mjs --grep="@discovery" --project=desktop-1440 --project=mobile-390 --workers=1
      - name: Upload discovery browser smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-browser-smoke-${{ github.run_id }}
          path: one-world-route-public-mvp/qa/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload discovery visual QA
        if: success() && (github.event_name != 'pull_request' || needs.changes.outputs.media_browser == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: discovery-visual-qa-${{ github.run_id }}
          path: one-world-route-public-mvp/qa/test-results
          if-no-files-found: error
          retention-days: 7


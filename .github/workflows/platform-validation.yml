          retention-days: 7


  production-browser:
    name: Production browser confidence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: one-world-route-public-mvp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: one-world-route-public-mvp/qa/package-lock.json
      - name: Install existing browser QA dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix qa
      - name: Wait for the current Production worker
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const expected=await readFile('sw.js','utf8');
          let ready=false;
          for(let attempt=0;attempt<40;attempt++){
            try{
              const response=await fetch('https://one-world-route.vercel.app/sw.js',{cache:'no-store',signal:AbortSignal.timeout(10000)});
              if(response.ok&&await response.text()===expected){ready=true;break}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          if(!ready)throw new Error('Current Production worker is not available');
          console.log('Production worker matches this main commit');
          JS
      - name: Reuse discovery, social, date and terrain checks on Production
        env:
          BASE_URL: https://one-world-route.vercel.app
          OWR_QA_NO_VIDEO: '1'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/node_modules/@playwright/test/cli.js test --config=qa/playwright.config.mjs tests/platform-smoke.spec.mjs --grep="scalable static visuals|inspiration selects|social story presents" --project=desktop-1440 --project=mobile-390 --project=mobile-360 --project=mobile-430 --workers=1 --output=qa/production-discovery-results
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/node_modules/@playwright/test/cli.js test --config=qa/playwright.config.mjs tests/regional-platform.spec.mjs --grep="flagship shell and route invariants" --project=desktop-1440 --project=mobile-390 --workers=1 --output=qa/production-world-results
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/node_modules/@playwright/test/cli.js test --config=qa/playwright.config.mjs tests/regional-platform.spec.mjs --grep="regional terrain activates" --project=desktop-1440 --project=mobile-390 --workers=2 --output=qa/production-terrain-results
      - name: Upload Production screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-qa-${{ github.run_id }}
          path: |
            one-world-route-public-mvp/qa/production-discovery-results
            one-world-route-public-mvp/qa/production-terrain-results
            one-world-route-public-mvp/qa/production-world-results
          if-no-files-found: ignore
          retention-days: 14

  validate:
    name: validate
    if: always()
    needs:
      - changes
      - core
      - release
      - builder-browser
      - content-browser
      - experience-browser
      - flagship-browser
      - discovery-browser
      - regional-browser
      - production-browser
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CORE_RESULT: ${{ needs.core.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          BUILDER_RESULT: ${{ needs.builder-browser.result }}
          CONTENT_RESULT: ${{ needs.content-browser.result }}
          EXPERIENCE_RESULT: ${{ needs.experience-browser.result }}
          FLAGSHIP_RESULT: ${{ needs.flagship-browser.result }}
          DISCOVERY_RESULT: ${{ needs.discovery-browser.result }}
          REGIONAL_RESULT: ${{ needs.regional-browser.result }}
          PRODUCTION_RESULT: ${{ needs.production-browser.result }}
        run: |
          set -euo pipefail

          test "$CHANGES_RESULT" = "success"
          test "$CORE_RESULT" = "success"
          test "$RELEASE_RESULT" = "success"

          case "$BUILDER_RESULT" in
            success|skipped) ;;
            *) echo "Builder browser smoke failed: $BUILDER_RESULT"; exit 1 ;;
          esac

          case "$CONTENT_RESULT" in
            success|skipped) ;;
            *) echo "Content journey browser smoke failed: $CONTENT_RESULT"; exit 1 ;;
          esac

          case "$EXPERIENCE_RESULT" in
            success|skipped) ;;
            *) echo "Place experience browser smoke failed: $EXPERIENCE_RESULT"; exit 1 ;;
          esac

          case "$FLAGSHIP_RESULT" in
            success|skipped) ;;
            *) echo "Flagship browser smoke failed: $FLAGSHIP_RESULT"; exit 1 ;;
          esac

          case "$DISCOVERY_RESULT" in
            success|skipped) ;;
            *) echo "Discovery browser smoke failed: $DISCOVERY_RESULT"; exit 1 ;;
          esac

          case "$REGIONAL_RESULT" in
            success|skipped) ;;
            *) echo "Regional browser smoke failed: $REGIONAL_RESULT"; exit 1 ;;
          esac

          case "$PRODUCTION_RESULT" in
            success|skipped) ;;
            *) echo "Production browser smoke failed: $PRODUCTION_RESULT"; exit 1 ;;
          esac

          echo "All required platform validation checks passed."

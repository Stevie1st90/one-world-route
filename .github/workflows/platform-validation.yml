name: Platform validation

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect QA scope
    runs-on: ubuntu-latest
    outputs:
      flagship_browser: ${{ steps.scope.outputs.flagship_browser }}
      regional_browser: ${{ steps.scope.outputs.regional_browser }}
      discovery_browser: ${{ steps.scope.outputs.discovery_browser }}
      builder_browser: ${{ steps.scope.outputs.builder_browser }}
      content_browser: ${{ steps.scope.outputs.content_browser }}
      experience_browser: ${{ steps.scope.outputs.experience_browser }}
      media_browser: ${{ steps.scope.outputs.media_browser }}
      content_trip_ids: ${{ steps.scope.outputs.content_trip_ids }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect browser QA scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          # Scheduled/manual confidence runs keep the broad browser suites available
          # without making every pull request pay their full cost.
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "flagship_browser=true" >> "$GITHUB_OUTPUT"
            echo "regional_browser=true" >> "$GITHUB_OUTPUT"
            echo "discovery_browser=true" >> "$GITHUB_OUTPUT"
            echo "builder_browser=true" >> "$GITHUB_OUTPUT"
            echo "content_browser=false" >> "$GITHUB_OUTPUT"
            echo "experience_browser=true" >> "$GITHUB_OUTPUT"
            echo "media_browser=true" >> "$GITHUB_OUTPUT"
            echo "content_trip_ids=" >> "$GITHUB_OUTPUT"
            echo "confidence run: broad generic browser suites enabled"
            exit 0
          fi

          # main only receives already validated PR commits in the normal delivery
          # workflow. Production smoke remains the live post-merge gate, so the
          # expensive generic browser regression is not duplicated on every push.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "flagship_browser=false" >> "$GITHUB_OUTPUT"
            echo "regional_browser=false" >> "$GITHUB_OUTPUT"
            echo "discovery_browser=false" >> "$GITHUB_OUTPUT"
            echo "builder_browser=false" >> "$GITHUB_OUTPUT"
            echo "content_browser=false" >> "$GITHUB_OUTPUT"
            echo "experience_browser=false" >> "$GITHUB_OUTPUT"
            echo "media_browser=false" >> "$GITHUB_OUTPUT"
            echo "content_trip_ids=" >> "$GITHUB_OUTPUT"
            echo "main push: fast gate only; browser regression is not duplicated"
            exit 0
          fi

          # Three-dot diff scopes QA to PR-authored changes even when main advanced after the branch was created.
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > /tmp/owr-changed-files.txt

          flagship_browser=false
          regional_browser=false
          discovery_browser=false
          builder_browser=false
          content_browser=false
          experience_browser=false
          media_browser=false
          content_trip_ids=""

          while IFS= read -r file; do
            case "$file" in
              .github/workflows/platform-validation.yml)
                flagship_browser=true
                regional_browser=true
                discovery_browser=true
                builder_browser=true
                experience_browser=true
                media_browser=true
                ;;
              internal-trip-builder/*)
                if [[ "$file" != "internal-trip-builder/README.md" ]]; then
                  builder_browser=true
                fi
                ;;
              one-world-route-public-mvp/data/platform/collections.json)
                discovery_browser=true
                ;;
              one-world-route-public-mvp/data/platform/trips/*.json)
                trip_slug="${file##*/}"
                trip_slug="${trip_slug%.json}"
                if [[ "$trip_slug" == "world-195" ]]; then
                  flagship_browser=true
                elif [[ -f "$file" ]]; then
                  content_browser=true
                  if [[ -n "$content_trip_ids" ]]; then
                    content_trip_ids="$content_trip_ids,$trip_slug"
                  else
                    content_trip_ids="$trip_slug"
                  fi
                fi
                ;;
              one-world-route-public-mvp/data/platform/trips.json)
                discovery_browser=true
                ;;
              one-world-route-public-mvp/data/platform/trip-index.json)
                # Generated from the catalog + trip datasets; Core verifies determinism.
                ;;
              one-world-route-public-mvp/data/platform/media-manifest.json|one-world-route-public-mvp/data/platform/route-visuals.json)
                # Shared media/route registries affect discovery rendering, but do not
                # imply Builder, Flagship, Regional or bespoke-cover fixture changes.
                # Core media contracts validate every registry entry.
                discovery_browser=true
                ;;
              one-world-route-public-mvp/data/platform/visual-briefs.json|one-world-route-public-mvp/data/platform/visual-coverage.json|one-world-route-public-mvp/data/platform/graphics-backlog.json)
                # Editorial/generated reports are exhaustively validated by Core.
                ;;
              one-world-route-public-mvp/assets/generated/routes/*)
                # Generic static-route rendering is exercised once by Discovery.
                discovery_browser=true
                ;;
              one-world-route-public-mvp/assets/media/journeys/*)
                discovery_browser=true
                media_browser=true
                ;;
              one-world-route-public-mvp/data/platform/place-experiences/*.json)
                # Core validates schema/locale coverage; this focused browser pass
                # verifies that country shards still load through the real renderer.
                experience_browser=true
                ;;
              one-world-route-public-mvp/data/platform/*)
                regional_browser=true
                builder_browser=true
                ;;
              one-world-route-public-mvp/qa/tests/trip-builder.spec.mjs|one-world-route-public-mvp/scripts/trip-draft-contract.mjs|one-world-route-public-mvp/scripts/test-trip-draft-contract.mjs|one-world-route-public-mvp/scripts/maintenance-queue-model.mjs|one-world-route-public-mvp/scripts/test-maintenance-queue.mjs|one-world-route-public-mvp/scripts/platform-extension-validators.mjs|one-world-route-public-mvp/scripts/platform-extension-validators/*)
                builder_browser=true
                ;;
              one-world-route-public-mvp/qa/tests/platform-smoke.spec.mjs|one-world-route-public-mvp/qa/playwright.config.mjs|one-world-route-public-mvp/qa/run-local.mjs)
                flagship_browser=true
                regional_browser=true
                discovery_browser=true
                experience_browser=true
                ;;
              one-world-route-public-mvp/qa/tests/discovery-fast.spec.mjs)
                discovery_browser=true
                ;;
              one-world-route-public-mvp/qa/tests/visual-cover-slot.spec.mjs|one-world-route-public-mvp/platform/media.js)
                discovery_browser=true
                media_browser=true
                ;;
              one-world-route-public-mvp/README.md)
                ;;
              one-world-route-public-mvp/features.bundle.js|one-world-route-public-mvp/features.bundle.css|one-world-route-public-mvp/core.bundle.js|one-world-route-public-mvp/core.bundle.css)
                # Generated artifacts inherit browser scope from their source files.
                ;;
              one-world-route-public-mvp/api/share.js|one-world-route-public-mvp/vercel.json|one-world-route-public-mvp/sitemap.xml)
                discovery_browser=true
                ;;
              one-world-route-public-mvp/platform/home.js|one-world-route-public-mvp/platform/home.css)
                discovery_browser=true
                ;;
              one-world-route-public-mvp/platform/place-experiences.js|one-world-route-public-mvp/platform/regional-detail.js)
                regional_browser=true
                experience_browser=true
                ;;
              one-world-route-public-mvp/platform/regional-*|one-world-route-public-mvp/platform/extensions.js|one-world-route-public-mvp/platform/extensions/*)
                regional_browser=true
                ;;
              one-world-route-public-mvp/platform/*)
                flagship_browser=true
                regional_browser=true
                ;;
              one-world-route-public-mvp/scripts/*)
                # Build/editorial scripts are covered by Core + Release unless a more specific case above requests browser QA.
                ;;
              one-world-route-public-mvp/data/*)
                flagship_browser=true
                ;;
              one-world-route-public-mvp/*.js|one-world-route-public-mvp/*.css|one-world-route-public-mvp/*.html|one-world-route-public-mvp/*.json|one-world-route-public-mvp/*.xml)
                flagship_browser=true
                regional_browser=true
                ;;
            esac
          done < /tmp/owr-changed-files.txt

          echo "flagship_browser=$flagship_browser" >> "$GITHUB_OUTPUT"
          echo "regional_browser=$regional_browser" >> "$GITHUB_OUTPUT"
          echo "discovery_browser=$discovery_browser" >> "$GITHUB_OUTPUT"
          echo "builder_browser=$builder_browser" >> "$GITHUB_OUTPUT"
          echo "content_browser=$content_browser" >> "$GITHUB_OUTPUT"
          echo "experience_browser=$experience_browser" >> "$GITHUB_OUTPUT"
          echo "media_browser=$media_browser" >> "$GITHUB_OUTPUT"
          echo "content_trip_ids=$content_trip_ids" >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          cat /tmp/owr-changed-files.txt
          echo "flagship_browser=$flagship_browser"
          echo "regional_browser=$regional_browser"
          echo "discovery_browser=$discovery_browser"
          echo "builder_browser=$builder_browser"
          echo "content_browser=$content_browser"
          echo "experience_browser=$experience_browser"
          echo "media_browser=$media_browser"
          echo "content_trip_ids=$content_trip_ids"

  core:
    name: Core checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: one-world-route-public-mvp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check platform.js
          node --check platform/runtime.js
          node --check platform/service-worker.js
          node --check platform/cloud-sync.js
          node --check platform/pwa-install.js
          node --check scripts/build-sync-config.mjs
          node --check scripts/build-cover-generation-queue.mjs
          node --check scripts/stage-cover-generation-results.mjs
          node --check scripts/release-cover-batch.mjs
          node --check scripts/cover-release-policy.mjs
          node --check scripts/test-cover-release-policy.mjs
          node --check scripts/test-apply-cover-batch-runner.mjs
          node --check scripts/build-world-showcase-visual-spec.mjs
          node --check scripts/test-world-showcase-visual.mjs
          node --check scripts/compose-world-showcase-cover.mjs
          node --check scripts/world-showcase-renderer.mjs
          node --check scripts/test-world-showcase-compositor.mjs
          node --check scripts/test-cloud-sync.mjs
          node --check platform/map-style.js
          node --check platform/i18n.js
          node --check platform/formatters.js
          node --check platform/legacy-localization.js
          node --check platform/model.js
          node --check platform/traveller.js
          node --check platform/traveller-ui.js
          node --check platform/ui.js
          node --check platform/navigation.js
          node --check platform/discovery.js
          node --check platform/trip-tools.js
          node --check platform/journey-adapter.js
          node --check platform/shared-knowledge.js
          node --check platform/traveller-fit.js
          node --check platform/trip-compare.js
          node --check platform/home.js
          node --check platform/media.js
          node --check platform/partners.js
          node --check platform/share.js
          node --check scripts/build-commercial-config.mjs
          node --check scripts/test-platform-partners.mjs
          node --check scripts/test-platform-share.mjs
          node --check platform/route-library.js
          node --check platform/regional-shell.js
          node --check platform/regional-detail.js
          node --check platform/regional-globe.js
          node --check platform/regional-timeline.js
          node --check platform/regional-controls.js
          node --check platform/regional-selection.js
          node --check platform/story.js
          node --check platform/extensions.js
          node --check platform/extensions/cruise.js
          node --check platform/extensions/road.js
          node --check platform/extensions/border.js
          node --check features.bundle.js
          node --check api/share.js
          node --check scripts/validate-platform-data.mjs
          node --check scripts/platform-extension-validators.mjs
          node --check scripts/platform-extension-validators/registry.mjs
          node --check scripts/platform-extension-validators/cruise.mjs
          node --check scripts/platform-extension-validators/road-trip.mjs
          node --check scripts/platform-extension-validators/border.mjs
          node --check scripts/platform-extension-validators/cruise-call.mjs
          node --check scripts/platform-extension-validators/port.mjs
          node --check scripts/platform-extension-validators/rail.mjs
          node --check scripts/scaffold-trip.mjs
          node --check scripts/audit-platform-maintenance.mjs
          node --check scripts/maintenance-queue-model.mjs
          node --check scripts/build-maintenance-queue.mjs
          node --check scripts/test-maintenance-queue.mjs
          node --check scripts/audit-platform-media.mjs
          node --check scripts/build-media-manifest.mjs
          node --check scripts/test-platform-media.mjs
          node --check scripts/test-journey-adapter.mjs
          node --check scripts/generate-seo.mjs
          node --check scripts/serve-local.mjs
          node --check scripts/test-preview-routes.mjs
          node --check scripts/test-regional-runtime.mjs
          node --check scripts/test-platform-rail-validator.mjs
          node --check scripts/trip-draft-contract.mjs
          node --check scripts/test-trip-draft-contract.mjs
          node --check scripts/flagship-topology-model.mjs
          node --check scripts/verification-date-model.mjs
          node --check scripts/flagship-readiness-model.mjs
          node --check scripts/flagship-operations-queue-model.mjs
          node --check scripts/flagship-recheck-model.mjs
          node --check scripts/audit-flagship-readiness.mjs
          node --check scripts/build-flagship-recheck-plan.mjs
          node --check scripts/audit-flagship-rechecks.mjs
          node --check scripts/build-flagship-operations-queue.mjs
          node --check scripts/test-flagship-topology.mjs
          node --check scripts/test-verification-dates.mjs
          node --check scripts/test-flagship-readiness.mjs
          node --check scripts/test-flagship-operations-queue.mjs
          node --check scripts/test-flagship-rechecks.mjs
          node --check scripts/test-trip-tools.mjs
          node --check scripts/test-trip-planning.mjs
          node --check scripts/test-journey-guide.mjs
          node --check scripts/test-place-experiences.mjs
          node --check scripts/experience-coverage-model.mjs
          node --check scripts/test-experience-coverage.mjs
          node --check scripts/test-traveller-fit.mjs
          node --check scripts/test-trip-compare.mjs
          node --check scripts/trip-index-model.mjs
          node --check scripts/build-trip-index.mjs
          node --check scripts/build-locale-coverage.mjs
          node --check scripts/test-trip-index.mjs
          node --check scripts/test-cache-policy.mjs
          node --check ../internal-trip-builder/server.mjs
          node --check ../internal-trip-builder/app.js
          node --check ../internal-trip-builder/test-builder.mjs
          node --check qa/tests/platform-smoke.spec.mjs
          node --check qa/tests/visual-cover-slot.spec.mjs
          node --check qa/tests/regional-platform.spec.mjs
          node --check qa/tests/production-smoke.spec.mjs
          node --check qa/tests/trip-builder.spec.mjs
          node --check qa/tests/content-trip-smoke.spec.mjs
      - name: Install pinned authoring renderer
        run: npm ci
      - name: Platform data validation
        run: node scripts/validate-platform-data.mjs
      - name: Existing public-data validation
        run: node scripts/validate-public-data.mjs
      - name: Delivery cache policy tests
        run: node --test scripts/test-cache-policy.mjs
      - name: Platform model tests
        run: node --test scripts/test-platform-model.mjs
      - name: Journey personalization tests
        run: node --test scripts/test-journey-adapter.mjs
      - name: Journey maintenance audit
        run: node scripts/audit-platform-maintenance.mjs
      - name: Maintenance queue tests
        run: node --test scripts/test-maintenance-queue.mjs
      - name: Journey media rights audit
        run: node scripts/audit-platform-media.mjs
      - name: Cover release policy tests
        run: node --test scripts/test-cover-release-policy.mjs
      - name: Cover apply runner tests
        run: node --test scripts/test-apply-cover-batch-runner.mjs
      - name: World showcase visual tests
        run: |
          node --test scripts/test-world-showcase-visual.mjs
          node scripts/build-world-showcase-visual-spec.mjs --check
      - name: World showcase compositor smoke
        run: node --test scripts/test-world-showcase-compositor.mjs
      - name: Cover generation batch contract
        run: |
          node scripts/build-cover-generation-queue.mjs --out="$RUNNER_TEMP/cover-generation-queue.json" --prompt-out="$RUNNER_TEMP/cover-generation-operator-prompt.md"
          node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cover-generation-queue.json','utf8'));if(q.items.length!==q.dispatchContract.imageToolCallsRequired)throw Error('imageToolCallsRequired mismatch');if(q.items.some(x=>x.imagesPerToolCall!==1))throw Error('imagesPerToolCall must be 1');if(new Set(q.items.map(x=>x.tripId)).size!==q.items.length)throw Error('duplicate tripId');if(new Set(q.items.map(x=>x.sourceFilename)).size!==q.items.length)throw Error('duplicate sourceFilename');console.log('cover batch contract ok:',q.items.length,'separate calls × 1 image');"
      - name: Static route visual freshness and policy
        run: |
          node scripts/build-route-visuals.mjs --check
          node scripts/build-region-visuals.mjs --check
          node --test scripts/test-visual-experience.mjs
          node --test scripts/test-route-visuals.mjs
      - name: Media renderer tests
        run: node --test scripts/test-platform-media.mjs
      - name: Platform locale tests
        run: node --test scripts/test-platform-i18n.mjs scripts/test-product-recovery.mjs
      - name: Sharing controller tests
        run: node --test scripts/test-platform-share.mjs
      - name: Partner link safeguards
        run: node --test scripts/test-platform-partners.mjs
      - name: Cloud workspace sync tests
        run: node --test scripts/test-cloud-sync.mjs
      - name: Platform formatter tests
        run: node --test scripts/test-platform-formatters.mjs
      - name: Public trip index tests
        run: node --test scripts/test-trip-index.mjs
      - name: Locale coverage audit
        run: node scripts/build-locale-coverage.mjs
      - name: Share page tests
        run: node --test scripts/test-share-pages.mjs
      - name: Platform navigation tests
        run: node --test scripts/test-platform-navigation.mjs
      - name: Trip tools tests
        run: node --test scripts/test-trip-tools.mjs
      - name: Practical planning tests
        run: node --test scripts/test-trip-planning.mjs
      - name: Journey guide tests
        run: node --test scripts/test-journey-guide.mjs
      - name: Place experience tests
        run: node --test scripts/test-place-experiences.mjs
      - name: Experience coverage tests
        run: node --test scripts/test-experience-coverage.mjs
      - name: Traveller Fit tests
        run: node --test scripts/test-traveller-fit.mjs
      - name: Journey comparison tests
        run: node --test scripts/test-trip-compare.mjs
      - name: Regional runtime integration tests
        run: node --test scripts/test-regional-runtime.mjs
      - name: Rail validator tests
        run: node --test scripts/test-platform-rail-validator.mjs
      - name: Trip draft publication contract tests
        run: node --test scripts/test-trip-draft-contract.mjs
      - name: Internal Trip Builder pipeline smoke
        run: node ../internal-trip-builder/test-builder.mjs
      - name: Story controller tests
        run: node --test scripts/test-platform-story.mjs
      - name: Continuity unit tests
        run: node --test scripts/test-continuity.mjs
      - name: Flagship topology tests
        run: node --test scripts/test-flagship-topology.mjs
      - name: Verification date tests
        run: node --test scripts/test-verification-dates.mjs
      - name: Flagship readiness audit tests
        run: node --test scripts/test-flagship-readiness.mjs
      - name: Operational geometry artifacts current
        run: |
          node scripts/build-flight-geometries.mjs --check
          node scripts/refresh-movement-geometry.mjs --check
      - name: Flagship generated artifacts current
        run: |
          node scripts/audit-flagship-readiness.mjs --check
          node scripts/build-flagship-operations-queue.mjs --check
          node scripts/build-flagship-recheck-plan.mjs --check
      - name: Flagship operations queue tests
        run: node --test scripts/test-flagship-operations-queue.mjs
      - name: Flagship recheck plan tests
        run: node --test scripts/test-flagship-rechecks.mjs

  release:
    name: Release build and preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: one-world-route-public-mvp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned authoring renderer
        run: npm ci
      - name: Release build
        run: node scripts/release-build.mjs
      - name: Local preview smoke test
        run: |
          node scripts/serve-local.mjs > /tmp/owr-local.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          node scripts/test-preview-routes.mjs

  builder-browser:
    name: Builder browser smoke
    needs: changes
    if: needs.changes.outputs.builder_browser == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: one-world-route-public-mvp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: one-world-route-public-mvp/qa/package-lock.json
      - name: Install browser QA dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix qa
      - name: Internal Trip Builder browser smoke
        env:
          OWR_QA_NO_VIDEO: '1'
        run: |
          node ../internal-trip-builder/server.mjs > /tmp/owr-builder.log 2>&1 &
          BUILDER_PID=$!
          trap 'kill $BUILDER_PID 2>/dev/null || true' EXIT
          sleep 1
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          cd qa
          BASE_URL="http://127.0.0.1:4175" OWR_CHROMIUM_PATH="$CHROME_BIN" ./node_modules/.bin/playwright test tests/trip-builder.spec.mjs --project=desktop-1440 --project=mobile-390 --workers=2 --output=builder-test-results
      - name: Upload builder browser QA artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: builder-browser-smoke-${{ github.run_id }}
          path: one-world-route-public-mvp/qa/builder-test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload builder visual QA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: builder-visual-qa-${{ github.run_id }}
          path: one-world-route-public-mvp/qa/builder-test-results
          if-no-files-found: error
          retention-days: 7

  content-browser:
    name: Content journey browser smoke
    needs: changes
    if: needs.changes.outputs.content_browser == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: one-world-route-public-mvp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: one-world-route-public-mvp/qa/package-lock.json
      - name: Install browser QA dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix qa
      - name: Run changed journey browser smoke
        env:
          OWR_QA_NO_VIDEO: '1'
          OWR_QA_CONTENT_TRIP_IDS: ${{ needs.changes.outputs.content_trip_ids }}
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          START_SECONDS=$(date +%s)
          STATUS=0
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/content-trip-smoke.spec.mjs --project=desktop-1440 --workers=1 || STATUS=$?
          DURATION=$(( $(date +%s) - START_SECONDS ))
          {
            echo "### Content journey browser smoke"
            echo "- Duration: ${DURATION}s"
            echo "- Budget: <= 90s"
            echo "- Strategy: all changed IDs contract-checked; max 3 representative journeys browser-rendered"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( DURATION > 90 )); then echo "::warning::Content browser smoke exceeded 90s budget (${DURATION}s)"; fi
          exit "$STATUS"
      - name: Upload content journey browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: content-browser-smoke-${{ github.run_id }}
          path: one-world-route-public-mvp/qa/test-results
          if-no-files-found: ignore
          retention-days: 7


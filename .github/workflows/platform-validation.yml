          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/platform-smoke.spec.mjs --grep="@regional @mobile-critical" --project=mobile-390 --workers=2
      - name: Upload regional browser smoke artifacts

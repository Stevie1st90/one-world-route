name: Flagship recheck watch

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Optional ISO date override (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: flagship-recheck-watch
  cancel-in-progress: true

jobs:
  recheck:
    name: Scheduled departure recheck audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: one-world-route-public-mvp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve audit date
        id: audit-date
        shell: bash
        run: |
          set -euo pipefail
          CHECK_DATE="${{ inputs.date }}"
          if [[ -z "$CHECK_DATE" ]]; then
            CHECK_DATE="$(date -u +%F)"
          fi
          if [[ ! "$CHECK_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid ISO date: $CHECK_DATE" >&2
            exit 1
          fi
          echo "value=$CHECK_DATE" >> "$GITHUB_OUTPUT"
      - name: Publish recheck summary
        env:
          CHECK_DATE: ${{ steps.audit-date.outputs.value }}
        shell: bash
        run: node scripts/audit-flagship-rechecks.mjs --date="$CHECK_DATE" --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Flag due or overdue rechecks
        env:
          CHECK_DATE: ${{ steps.audit-date.outputs.value }}
        run: node scripts/audit-flagship-rechecks.mjs --date="$CHECK_DATE" --strict

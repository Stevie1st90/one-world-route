name: Platform full browser regression

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1,4'

permissions:
  contents: read

concurrency:
  group: platform-full-browser-regression
  cancel-in-progress: true

jobs:
  browser-regression:
    name: Full browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: one-world-route-public-mvp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: one-world-route-public-mvp/qa/package-lock.json
      - name: Install browser QA dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix qa
      - name: Full Discovery regression
        env:
          OWR_QA_NO_VIDEO: '1'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/platform-smoke.spec.mjs tests/visual-cover-slot.spec.mjs --grep="@discovery" --project=desktop-1440 --project=desktop-1920 --project=mobile-360 --project=mobile-390 --project=mobile-430 --workers=5
      - name: Full Regional regression
        env:
          OWR_QA_NO_VIDEO: '1'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/platform-smoke.spec.mjs --grep="@regional" --project=desktop-1440 --project=desktop-1920 --workers=2
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/platform-smoke.spec.mjs --grep="@regional @mobile-critical" --project=mobile-360 --project=mobile-390 --project=mobile-430 --workers=3
      - name: Flagship and Place Experience regression
        env:
          OWR_QA_NO_VIDEO: '1'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/platform-smoke.spec.mjs --grep="@flagship" --project=desktop-1440 --project=mobile-390 --workers=2
          OWR_CHROMIUM_PATH="$CHROME_BIN" node qa/run-local.mjs tests/platform-smoke.spec.mjs --grep="@experience" --project=desktop-1440 --workers=2
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-browser-regression-${{ github.run_id }}
          path: one-world-route-public-mvp/qa/test-results
          if-no-files-found: ignore
          retention-days: 7
